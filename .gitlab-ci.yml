test_build:
  stage: build
  image: node:lts
  script:
    - corepack enable
    - yarn install
    - yarn build
  artifacts:
    paths:
      - dist
    expire_in: 1 mos

release_build:
  stage: build
  image: node:lts
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - corepack enable
    - yarn install
    - yarn build
  artifacts:
    paths:
      - dist
    expire_in: never

release_job:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: release_build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "running release_job for $TAG"
  release:
    name: 'Release $TAG'
    tag_name: '$TAG'
    description: "Release created using the release-cli. Release '$TAG'"
    assets:
      links:
        - name: 'dist'
          url: '$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$JOB_ID/artifacts/download'