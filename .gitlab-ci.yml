test_build:
  stage: test
  image: node:lts
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - corepack enable
    - yarn install
    - yarn build
    - echo "BUILD_JOB_ID=$CI_JOB_ID" > .env
  artifacts:
    paths:
      - dist/
      - .env
    expire_in: 1 mos
    reports:
      dotenv: .env

release_build:
  stage: build
  image: node:lts
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - corepack enable
    - yarn install
    - yarn build
    - echo "BUILD_JOB_ID=$CI_JOB_ID" > .env
  artifacts:
    paths:
      - dist/
      - .env
    expire_in: never
    reports:
      dotenv: .env

release_job:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: release_build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "running release_job for $TAG."
    - echo "Linking assets 'dist' to url $CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$BUILD_JOB_ID/artifacts/download"
  release:
    name: 'Release $TAG'
    tag_name: '$TAG'
    description: "Release created using the release-cli. Release '$TAG'"
    assets:
      links:
        - name: 'dist'
          url: '$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$BUILD_JOB_ID/artifacts/download'